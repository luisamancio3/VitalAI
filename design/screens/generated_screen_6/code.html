<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=393, height=852, initial-scale=1.0" name="viewport"/>
<title>iPhone 15 Pro Lock Screen - VitalAI</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="ios-typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .ios-time {
      font-weight: 700;
      font-size: 80px;
      letter-spacing: -2px;
    }
    .ios-date {
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.2px;
    }
  </style>
<style data-purpose="ios-glassmorphism">
    /* Glassmorphism effect mimicking iOS blur */
    .ios-blur {
      background: rgba(45, 45, 45, 0.45);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
    }
    .ios-button-blur {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-black flex justify-center items-center h-screen w-screen">
<!-- BEGIN: iPhone Container -->
<main class="relative w-[393px] h-[852px] bg-cover bg-center overflow-hidden rounded-[55px] shadow-2xl border-[8px] border-zinc-800" data-purpose="lock-screen-container" id="iphone-15-pro-frame" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBT-Th81cXwdMMdX8jHbYF8VsTo04sU-Gwl3cXUFfG7DOUXSoFZk6kpe2ZimoRKdbwvRe6E3CJomwSkJSOqT_2MAJZs8UrLPoVzBbiUObVYjR9ZIcKX3aNd5PvXccQ2eBvSgVUCwN0z58YNPXrVQ-YfMvguED7PcwGaQkeiE8jy8QFmUK2MxliVrU6jwUzPIayvbPgS1EkvSV7DTwmH-t6LSFzDWpIulchYkJR-oHss-ObFOGEfrFDKeqAxpfK5v4PBgt4v5sK1NXyc');">
<!-- BEGIN: Dynamic Island Placeholder -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-[120px] h-[35px] bg-black rounded-[20px] z-50"></div>
<!-- END: Dynamic Island Placeholder -->
<!-- BEGIN: Status Bar -->
<div class="flex justify-between items-center px-10 pt-10 text-white text-[13px] font-semibold">
<span>18:30</span>
<div class="flex gap-1.5 items-center">
<svg fill="currentColor" height="16" viewbox="0 0 256 256" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M248,104v48a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8V104a8,8,0,0,1,8-8H240A8,8,0,0,1,248,104Z" opacity="0.2"></path><path d="M240,88H32A16,16,0,0,0,16,104v48a16,16,0,0,0,16,16H240a16,16,0,0,0,16-16V104A16,16,0,0,0,240,88Zm0,64H32V104H240v48Zm16-40v32a8,8,0,0,1-16,0V112a8,8,0,0,1,16,0Z"></path></svg>
<svg fill="currentColor" height="16" viewbox="0 0 256 256" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M152,48V208a8,8,0,0,1-16,0V48a8,8,0,0,1,16,0Zm-48,48V208a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0ZM56,144V208a8,8,0,0,1-16,0V144a8,8,0,0,1,16,0Zm144-88V208a8,8,0,0,1-16,0V56a8,8,0,0,1,16,0Z"></path></svg>
</div>
</div>
<!-- END: Status Bar -->
<!-- BEGIN: Time and Date Section -->
<div class="mt-12 text-center text-white/90">
<h2 class="ios-date mb-1">Quinta-feira, 13 de março</h2>
<h1 class="ios-time">18:30</h1>
</div>
<!-- END: Time and Date Section -->
<!-- BEGIN: Notification Center Container -->
<div class="absolute inset-x-0 bottom-32 px-4 space-y-2 flex flex-col items-center">
<!-- BEGIN: VitalAI Notification Card -->
<article class="ios-blur w-full max-w-[361px] rounded-[28px] p-4 text-white shadow-lg" data-purpose="notification-card">
<!-- Header -->
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-2">
<!-- App Icon Placeholder -->
<div class="w-7 h-7 bg-green-500 rounded-lg flex items-center justify-center">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<span class="text-[13px] font-semibold tracking-tight text-white/90">VitalAI — Treino detectado</span>
</div>
<span class="text-[12px] font-medium text-white/60">agora</span>
</div>
<!-- Body Content -->
<div class="space-y-3">
<p class="text-[14px] leading-tight text-white/90">
            Ótimo treino! Você queimou ~380kcal em 42min de corrida. Para recuperação, proteína + carb em até 45min. Que tal um wrap de frango com arroz? Leva 15min.
          </p>
<!-- Action Buttons -->
<div class="flex gap-2 pt-1">
<button class="flex-1 ios-button-blur py-2.5 rounded-xl text-[14px] font-semibold text-white/95 active:scale-95 transition-transform">
              Ver receita
            </button>
<button class="flex-1 ios-button-blur py-2.5 rounded-xl text-[14px] font-semibold text-white/95 active:scale-95 transition-transform">
              Outra opção
            </button>
</div>
</div>
</article>
<!-- END: VitalAI Notification Card -->
</div>
<!-- END: Notification Center Container -->
<!-- BEGIN: Lock Screen Bottom Actions -->
<div class="absolute bottom-12 inset-x-0 px-10 flex justify-between items-center">
<!-- Flashlight -->
<div class="w-12 h-12 rounded-full ios-blur flex items-center justify-center text-white">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><path d="M128,160a32,32,0,1,0,32,32A32,32,0,0,0,128,160Zm0,48a16,16,0,1,1,16-16A16,16,0,0,1,128,208ZM215.11,92.68l-44-66a15.89,15.89,0,0,0-26.6,0l-44,66A16,16,0,0,0,113.84,118l1.45,4.35a8,8,0,1,0,15.18-5.06l-1.45-4.35a1,1,0,0,1,1.13-1.34L128,112l-2.15,0a1,1,0,0,1,1.13,1.34l1.45,4.35a8,8,0,0,0,15.18,5.06l1.45-4.35a16,16,0,0,0,13.31-25.32ZM128,96a1,1,0,0,1,0-2L144.67,49l31.33,47Z"></path></svg>
</div>
<!-- Camera -->
<div class="w-12 h-12 rounded-full ios-blur flex items-center justify-center text-white">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><path d="M208,56H181.33L165.6,32.4a8,8,0,0,0-6.67-3.4H97.07a8,8,0,0,0-6.67,3.4L74.67,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.67-3.4L102.4,45h51.2l15.73,23.6A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"></path></svg>
</div>
</div>
<!-- Home Indicator -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[130px] h-[5px] bg-white rounded-full"></div>
<!-- END: Lock Screen Bottom Actions -->
</main>
<!-- END: iPhone Container -->
</body></html>
