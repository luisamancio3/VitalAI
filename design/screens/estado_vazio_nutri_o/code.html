<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bd4a7",
                        "background-light": "#f7f8fa",
                        "background-dark": "#12201c",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Bar -->
<header class="bg-white dark:bg-slate-900 px-4 pt-4 pb-2 sticky top-0 z-10 shadow-sm">
<div class="flex items-center justify-between mb-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Nutrição</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">calendar_today</span>
</button>
</div>
<!-- Date Selector -->
<div class="flex items-center justify-center gap-4 py-2">
<button class="text-primary">
<span class="material-symbols-outlined text-lg leading-none">chevron_left</span>
</button>
<span class="text-sm font-bold text-slate-600 dark:text-slate-400">Hoje, 13 Mar</span>
<button class="text-primary">
<span class="material-symbols-outlined text-lg leading-none">chevron_right</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-4 py-6 overflow-y-auto">
<!-- Macro Summary Pills -->
<div class="grid grid-cols-2 gap-3 mb-8">
<!-- Protein -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-start mb-2">
<span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Proteína</span>
<span class="text-xs font-bold text-red-500">0g</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
<div class="bg-red-500 h-full w-0"></div>
</div>
</div>
<!-- Carbs -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-start mb-2">
<span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Carbo</span>
<span class="text-xs font-bold text-yellow-500">0g</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
<div class="bg-yellow-500 h-full w-0"></div>
</div>
</div>
<!-- Fat -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-start mb-2">
<span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Gordura</span>
<span class="text-xs font-bold text-blue-500">0g</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
<div class="bg-blue-500 h-full w-0"></div>
</div>
</div>
<!-- Calories -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-start mb-2">
<span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Calorias</span>
<span class="text-xs font-bold text-emerald-500">0kcal</span>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
<div class="bg-emerald-500 h-full w-0"></div>
</div>
</div>
</div>
<!-- Empty State Illustration -->
<div class="flex flex-col items-center justify-center py-12 px-6 text-center">
<div class="relative mb-8 w-48 h-48 flex items-center justify-center">
<!-- Abstract Plate Illustration -->
<div class="absolute inset-0 bg-primary/5 dark:bg-primary/10 rounded-full border-4 border-dashed border-slate-200 dark:border-slate-700"></div>
<div class="relative text-slate-300 dark:text-slate-600">
<span class="material-symbols-outlined !text-8xl">restaurant</span>
</div>
</div>
<h3 class="text-[18px] font-semibold text-slate-900 dark:text-white mb-3">Nenhuma refeição registrada hoje</h3>
<p class="text-[14px] text-slate-500 dark:text-slate-400 mb-8 max-w-[280px]">
                O VitalAI detecta automaticamente quando você come. Ou registre manualmente tocando no +
            </p>
<button class="inline-flex items-center px-6 py-3 border-2 border-primary text-primary font-bold rounded-xl hover:bg-primary/5 transition-colors">
                Registrar refeição
            </button>
</div>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-24 right-6">
<button class="w-14 h-14 bg-primary text-white rounded-full shadow-lg shadow-primary/30 flex items-center justify-center hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-3xl font-bold">add</span>
</button>
</div>
<!-- Bottom Navigation -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 px-2 pb-6 pt-2">
<div class="flex justify-around items-center">
<a class="flex flex-col items-center gap-1 p-2 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Home</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-primary" href="#">
<span class="material-symbols-outlined filled-icon">restaurant</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Nutrição</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-400" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Relatórios</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Perfil</span>
</a>
</div>
</nav>
</body></html>
