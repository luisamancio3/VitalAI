<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VitalAI - Empty State</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2DD4A8',
            secondary: '#4A90D9',
            dark: '#1A1A2E',
            muted: '#6B7280',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      background-color: #f9fafb;
      -webkit-tap-highlight-color: transparent;
    }
    /* Fixed container to simulate iPhone 15 Pro dimensions */
    .mobile-screen {
      width: 393px;
      height: 852px;
      background: white;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0,0,0,0.1);
    }
    .safe-area-bottom {
      padding-bottom: 34px;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- BEGIN: Main Mobile Container -->
<main class="mobile-screen font-sans">
<!-- BEGIN: Top Bar -->
<header class="px-6 pt-14 pb-4 flex items-center justify-between" data-purpose="app-header">
<h1 class="text-[22px] font-bold text-dark">Bom dia, Luis</h1>
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-semibold" data-purpose="user-avatar">
        L
      </div>
</header>
<!-- END: Top Bar -->
<!-- BEGIN: Content Area -->
<section class="flex-1 px-8 flex flex-col items-center justify-center" data-purpose="empty-state-content">
<!-- Illustration Placeholder -->
<div class="w-full h-56 mb-8 flex items-center justify-center" data-purpose="illustration">
<!-- Using an SVG placeholder that represents the described illustration -->
<svg fill="none" height="200" viewbox="0 0 240 200" width="240" xmlns="http://www.w3.org/2000/svg">
<circle cx="120" cy="100" fill="#2DD4A8" fill-opacity="0.1" r="80"></circle>
<rect fill="#4A90D9" height="80" rx="8" width="40" x="140" y="60"></rect> <!-- Phone -->
<circle cx="90" cy="80" fill="#2DD4A8" r="30"></circle> <!-- Person Head -->
<rect fill="#2DD4A8" height="40" rx="20" width="60" x="60" y="115"></rect> <!-- Person Body -->
<rect fill="white" fill-opacity="0.5" height="4" rx="2" width="10" x="100" y="135"></rect> <!-- Smartwatch -->
</svg>
</div>
<div class="text-center space-y-3">
<h2 class="text-[22px] font-bold text-dark leading-tight">Seu dia está começando!</h2>
<p class="text-[14px] text-muted leading-relaxed px-4">
          Use seu smartwatch normalmente. O VitalAI vai começar a te conhecer e enviar insights personalizados em breve.
        </p>
</div>
<!-- BEGIN: Setup Checklist -->
<div class="w-full mt-10 space-y-4" data-purpose="setup-checklist">
<!-- Row 1: Success -->
<div class="flex items-center space-x-3 p-1">
<div class="flex-shrink-0 w-5 h-5 bg-primary rounded-full flex items-center justify-center">
<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[16px] text-dark">Smartwatch conectado</span>
</div>
<!-- Row 2: Success -->
<div class="flex items-center space-x-3 p-1">
<div class="flex-shrink-0 w-5 h-5 bg-primary rounded-full flex items-center justify-center">
<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
</div>
<span class="text-[16px] text-dark">Notificações ativadas</span>
</div>
<!-- Row 3: Pending -->
<div class="flex items-center space-x-3 p-1">
<div class="flex-shrink-0 w-5 h-5 border-2 border-[#FFA500] rounded-full flex items-center justify-center">
<div class="w-2 h-2 bg-[#FFA500] rounded-full"></div>
</div>
<span class="text-[16px] text-dark">Perfil incompleto</span>
</div>
</div>
<!-- END: Setup Checklist -->
<!-- Action Button -->
<button class="w-full mt-10 bg-primary h-[48px] rounded-[12px] text-white font-bold text-[16px] active:opacity-90 transition-opacity" data-purpose="primary-action">
        Completar perfil
      </button>
</section>
<!-- END: Content Area -->
<!-- BEGIN: Bottom Navigation -->
<nav class="border-t border-gray-100 flex justify-between px-8 pt-4 safe-area-bottom bg-white" data-purpose="bottom-navigation">
<div class="flex flex-col items-center space-y-1">
<svg class="w-6 h-6 text-primary" fill="currentColor" viewbox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
<span class="text-[10px] font-medium text-primary">Home</span>
</div>
<div class="flex flex-col items-center space-y-1">
<svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-medium text-gray-400">Nutrição</span>
</div>
<div class="flex flex-col items-center space-y-1">
<svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-medium text-gray-400">Relatórios</span>
</div>
<div class="flex flex-col items-center space-y-1">
<svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span class="text-[10px] font-medium text-gray-400">Perfil</span>
</div>
</nav>
<!-- END: Bottom Navigation -->
</main>
<!-- END: Main Mobile Container -->
</body></html>
