<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>

<title>VitalAI Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                "background-dark": "#12201c",

                "text-muted": "#6B7280"

              fontFamily: {
                "display": ["Inter", "sans-serif"]

              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},

          },
        }

</div>

<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1">bedtime</span>
</div>
<div class="absolute top-1/2 right-10 text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1">footprint</span>
</div>
</div>

<h1 class="text-text-main text-[22px] font-bold leading-tight tracking-[-0.015em] text-center mb-4">

<p class="text-text-muted text-base font-normal leading-relaxed text-center mb-10 px-2">

<div class="h-2 w-2 rounded-full bg-slate-200"></div>
<div class="h-2 w-2 rounded-full bg-slate-200"></div>
