<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>iPhone 15 Pro Lock Screen - VitalAI Notification</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Inter Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="global-typography">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style data-purpose="ios-system-styles">
    /* Glassmorphism Effect for iOS Notifications */
    .glass-notification {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .glass-button {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    /* Simulate iPhone status bar notch/Dynamic Island */
    .dynamic-island {
      width: 125px;
      height: 36px;
      background: black;
      border-radius: 20px;
      margin: 10px auto 0;
    }

    /* Lock Screen specific shadow for text */
    .ios-text-shadow {
      text-shadow: 0px 1px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
<!-- BEGIN: iPhone Frame -->
<div class="relative overflow-hidden bg-cover bg-center shadow-2xl border-[8px] border-gray-800 rounded-[60px]" data-purpose="device-container" id="iphone-15-pro" style="width: 393px; height: 852px; background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD9yYsegWvYIyJScWGDG00jtpbEx9E4J0UDxcnuH7EQTfUUxUYE4z4s_EMeoO2Zk2BwHiXDO36jTwQQbVNxZW9EAUQx4E5TIm5-JYTatgoPHXC0hUWXQvzyRiHOcdJi9wU_A6UmwdW9fKmhE1x8atvzrR0f9JUNAVlk3S8qbzRu75DqY3UqdjyWnBeJe5vsotIeCnigUsbQhHIFQeAodRSd39fKjRG4eVqY0SbKN-TEPCi8PrHDrE7L93Cp7YWC9rMu_fw-9DC5MvjE');">
<!-- BEGIN: Top System UI -->
<header class="relative z-10 w-full pt-2">
<div class="dynamic-island" data-purpose="dynamic-island"></div>
<!-- Clock and Date -->
<div class="mt-12 text-center text-white ios-text-shadow">
<p class="text-[20px] font-medium opacity-90">Quinta-feira, 13 de março</p>
<h1 class="text-[100px] font-bold leading-tight -mt-2 tracking-tighter">15:22</h1>
</div>
</header>
<!-- END: Top System UI -->
<!-- BEGIN: Lock Screen Content (Notification) -->
<main class="absolute bottom-16 left-0 right-0 px-4 flex flex-col gap-3" data-purpose="notification-area">
<!-- Expanded VitalAI Notification Card -->
<div class="glass-notification rounded-[28px] overflow-hidden flex flex-col w-full shadow-lg" data-purpose="expanded-notification">
<!-- Header Part -->
<div class="px-5 pt-4 pb-3 flex items-start gap-3">
<!-- App Icon (VitalAI) -->
<div class="w-10 h-10 bg-green-500 rounded-[10px] flex items-center justify-center flex-shrink-0" data-purpose="app-icon">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-0.5">
<span class="text-[13px] font-semibold text-black/80 uppercase tracking-tight">VitalAI</span>
<span class="text-[12px] text-black/50">agora</span>
</div>
<p class="text-[15px] leading-[1.3] text-black/90 font-medium">
              Já faz 90 minutos sem movimento. Uma caminhada rápida de 5 minutos faz diferença — seu corpo agradece.
            </p>
</div>
</div>
<!-- Action Buttons Area -->
<div class="px-3 pb-3 pt-1 flex flex-col gap-2" data-purpose="notification-actions">
<button class="glass-button w-full py-3.5 rounded-2xl text-[17px] font-semibold text-blue-600 active:bg-white/40 transition-colors">
            Ok, vou me mexer
          </button>
<button class="glass-button w-full py-3.5 rounded-2xl text-[17px] font-medium text-black/70 active:bg-white/40 transition-colors">
            Estou ocupado
          </button>
</div>
</div>
<!-- END: Expanded VitalAI Notification Card -->
</main>
<!-- END: Lock Screen Content -->
<!-- BEGIN: Bottom System Bar -->
<footer class="absolute bottom-8 left-0 right-0 flex justify-between px-12 items-center z-10">
<!-- Flashlight -->
<div class="w-12 h-12 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 6V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"></path><path d="M6 10h12"></path><path d="M11 10v12h2V10"></path><path d="M15 10v10a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V10"></path></svg>
</div>
<!-- Home Indicator -->
<div class="absolute bottom-[-16px] left-1/2 -translate-x-1/2 w-32 h-1.5 bg-white/60 rounded-full"></div>
<!-- Camera -->
<div class="w-12 h-12 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
</div>
</footer>
<!-- END: Bottom System Bar -->
</div>
<!-- END: iPhone Frame -->
</body></html>
