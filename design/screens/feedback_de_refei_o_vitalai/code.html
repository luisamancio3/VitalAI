<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bd4a7",
                        "background-light": "#f6f8f7",
                        "background-dark": "#12201c",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .blur-bg { filter: blur(8px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex justify-center items-center min-h-screen">
<!-- iPhone 15 Pro Frame Emulator -->
<div class="relative w-[393px] h-[852px] bg-white rounded-[55px] shadow-2xl overflow-hidden border-[8px] border-slate-900">
<!-- Background: Nutrition Screen (Blurred/Dimmed) -->
<div class="absolute inset-0 z-0 blur-bg opacity-40">
<div class="p-6 space-y-6">
<div class="flex justify-between items-center">
<div class="h-8 w-32 bg-slate-200 rounded-full"></div>
<div class="h-8 w-8 bg-slate-200 rounded-full"></div>
</div>
<div class="h-40 w-full bg-primary/10 rounded-xl border border-primary/20 flex items-center justify-center">
<div class="h-24 w-24 rounded-full border-8 border-primary border-t-transparent"></div>
</div>
<div class="space-y-3">
<div class="h-4 w-1/2 bg-slate-200 rounded-full"></div>
<div class="h-20 w-full bg-slate-100 rounded-xl"></div>
<div class="h-20 w-full bg-slate-100 rounded-xl"></div>
<div class="h-20 w-full bg-slate-100 rounded-xl"></div>
</div>
</div>
</div>
<!-- Dim Overlay -->
<div class="absolute inset-0 bg-black/40 z-10"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 left-0 right-0 z-20 bg-white dark:bg-slate-900 rounded-t-[20px] shadow-2xl flex flex-col max-h-[80%]">
<!-- Handle -->
<div class="flex h-6 w-full items-center justify-center shrink-0">
<div class="h-1 w-9 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<!-- Content Container -->
<div class="px-6 pb-10 pt-2 overflow-y-auto">
<!-- Title -->
<h2 class="text-[#1A1A2E] dark:text-slate-100 text-[18px] font-semibold leading-tight text-center mb-6">
                    Como foi o almoço?
                </h2>
<!-- Meal Info Row -->
<div class="flex items-center gap-3 bg-background-light dark:bg-slate-800 p-3 rounded-xl mb-8">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">restaurant</span>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium">Frango grelhado com arroz</p>
<p class="text-[#6B7280] text-xs">Informação da refeição</p>
</div>
<div class="text-[#6B7280] text-sm">12:35</div>
</div>
<!-- Rating Section -->
<div class="text-center mb-8">
<p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Sua avaliação</p>
<div class="flex justify-center gap-2">
<span class="material-symbols-outlined text-[40px] text-[#FFD700]" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-[40px] text-[#FFD700]" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-[40px] text-[#FFD700]" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-[40px] text-[#FFD700]" style="font-variation-settings: 'FILL' 1">star</span>
<span class="material-symbols-outlined text-[40px] text-slate-300 dark:text-slate-600">star</span>
</div>
</div>
<!-- Text Area -->
<div class="mb-8">
<textarea class="w-full h-24 p-4 text-sm text-slate-900 dark:text-slate-100 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all resize-none" placeholder="Algum comentário? (opcional)"></textarea>
<p class="mt-2 text-[11px] text-slate-400">Ex: muito salgado, porção pequena...</p>
</div>
<!-- Actions -->
<div class="space-y-4">
<button class="w-full h-[48px] bg-primary hover:bg-primary/90 text-white font-semibold rounded-[12px] shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                        Enviar
                    </button>
<button class="w-full text-center text-[#6B7280] text-sm font-medium py-2">
                        Pular
                    </button>
</div>
</div>
<!-- Home Indicator -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1 bg-slate-900/10 dark:bg-slate-100/10 rounded-full"></div>
</div>
</div>
<!-- Dynamic Island -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-32 h-8 bg-black rounded-full z-30"></div>
</div>
</body></html>
