<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bd4a7",
                        "background-light": "#f6f8f7",
                        "background-dark": "#12201c",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>VitalAI - Relatório Semanal</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<!-- iPhone 15 Pro Container Emulation -->
<div class="relative w-full max-w-[393px] min-h-screen bg-white dark:bg-slate-900 shadow-2xl flex flex-col overflow-x-hidden">
<!-- TopAppBar Component -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 py-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
<div class="flex size-10 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Relatório semanal</h2>
<div class="flex size-10 items-center justify-end cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">share</span>
</div>
</header>
<!-- Centered Summary Section -->
<main class="flex-1 px-6 pt-8 pb-32">
<div class="text-center space-y-2 mb-8">
<h1 class="text-[#1A1A2E] dark:text-white text-[22px] font-bold leading-tight tracking-tight">Sua semana em resumo</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">3 a 9 de março de 2026</p>
</div>
<!-- Central Circular Progress Ring -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="relative flex items-center justify-center">
<svg class="w-48 h-48 transform -rotate-90">
<!-- Background Circle -->
<circle class="text-slate-100 dark:text-slate-800" cx="96" cy="96" fill="transparent" r="88" stroke="currentColor" stroke-width="12"></circle>
<!-- Progress Circle -->
<circle class="text-primary" cx="96" cy="96" fill="transparent" r="88" stroke="currentColor" stroke-dasharray="552.92" stroke-dashoffset="121.64" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="text-5xl font-bold text-slate-900 dark:text-white">78</span>
<span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Score</span>
</div>
</div>
<div class="mt-6 flex items-center gap-1.5 text-primary font-semibold text-sm">
<span class="material-symbols-outlined text-sm">trending_up</span>
<span>3 pontos acima da semana passada</span>
</div>
</div>
<!-- Pillars Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Card 1: Sono -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="material-symbols-outlined text-amber-500 bg-amber-50 dark:bg-amber-500/10 p-2 rounded-lg text-xl">dark_mode</span>
<span class="text-lg font-bold text-amber-500">72</span>
</div>
<div>
<p class="text-sm font-bold text-slate-700 dark:text-slate-200">Sono</p>
<div class="w-full h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full mt-2 overflow-hidden">
<div class="h-full bg-amber-500 rounded-full" style="width: 72%;"></div>
</div>
</div>
</div>
<!-- Card 2: Nutrição -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="material-symbols-outlined text-primary bg-primary/10 p-2 rounded-lg text-xl">restaurant</span>
<span class="text-lg font-bold text-primary">81</span>
</div>
<div>
<p class="text-sm font-bold text-slate-700 dark:text-slate-200">Nutrição</p>
<div class="w-full h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full mt-2 overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 81%;"></div>
</div>
</div>
</div>
<!-- Card 3: Atividade -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="material-symbols-outlined text-primary bg-primary/10 p-2 rounded-lg text-xl">directions_run</span>
<span class="text-lg font-bold text-primary">85</span>
</div>
<div>
<p class="text-sm font-bold text-slate-700 dark:text-slate-200">Atividade</p>
<div class="w-full h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full mt-2 overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 85%;"></div>
</div>
</div>
</div>
<!-- Card 4: Bem-estar -->
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="material-symbols-outlined text-amber-500 bg-amber-50 dark:bg-amber-500/10 p-2 rounded-lg text-xl">favorite</span>
<span class="text-lg font-bold text-amber-500">74</span>
</div>
<div>
<p class="text-sm font-bold text-slate-700 dark:text-slate-200">Bem-estar</p>
<div class="w-full h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full mt-2 overflow-hidden">
<div class="h-full bg-amber-500 rounded-full" style="width: 74%;"></div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Sticky Area -->
<footer class="fixed bottom-0 w-full max-w-[393px] bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-100 dark:border-slate-800 p-4 space-y-3">
<button class="w-full h-12 bg-primary text-white font-bold rounded-xl flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all">
                Ler relatório completo
            </button>
<button class="w-full h-12 bg-transparent text-slate-600 dark:text-slate-300 font-bold rounded-xl border border-slate-300 dark:border-slate-600 flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
<span class="material-symbols-outlined text-xl">download</span>
                Exportar PDF
            </button>
<!-- iPhone Indicator Handle -->
<div class="flex justify-center pt-2">
<div class="w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</footer>
</div>
</body></html>
