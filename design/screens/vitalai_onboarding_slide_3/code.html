<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bd4a7",
                        "secondary": "#4A90D9",
                        "background-light": "#f6f8f7",
                        "background-dark": "#12201c",
                        "neutral-title": "#1A1A2E",
                        "neutral-text": "#6B7280"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .illustration-bg {
            background: linear-gradient(180deg, #E6F9F4 0%, #FFFFFF 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex justify-center items-center min-h-screen">
<!-- iPhone 15 Pro Wrapper (Simplified for Web View) -->
<div class="relative w-[393px] h-[852px] bg-white overflow-hidden shadow-2xl rounded-[3rem] border-[8px] border-slate-900 flex flex-col">
<!-- Top Half: Illustration Area -->
<div class="relative flex-1 illustration-bg flex flex-col items-center justify-center px-8">
<!-- Navigation/Skip Header -->
<div class="absolute top-12 right-6">
<button class="text-neutral-text font-medium text-sm">Pular</button>
</div>
<!-- Illustration Container -->
<div class="w-full h-80 flex items-center justify-center relative">
<!-- Abstract Health Report Elements -->
<div class="absolute -top-4 -right-2 w-32 h-40 bg-white/80 rounded-xl shadow-lg border border-primary/20 p-3 flex flex-col gap-2">
<div class="w-full h-2 bg-primary/20 rounded-full"></div>
<div class="w-3/4 h-2 bg-primary/20 rounded-full"></div>
<div class="w-full h-16 bg-primary/10 rounded-lg mt-1 flex items-end p-2 gap-1">
<div class="flex-1 bg-primary h-8 rounded-t-sm"></div>
<div class="flex-1 bg-secondary h-12 rounded-t-sm"></div>
<div class="flex-1 bg-primary h-6 rounded-t-sm"></div>
</div>
</div>
<!-- Main Illustration Placeholder -->
<div class="w-64 h-64 bg-primary/5 rounded-full flex items-center justify-center">
<img alt="Person reading health report on phone with floating charts" class="w-full h-full object-contain" data-alt="Person reading health report on phone with floating charts" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCL0KLjCN2e2cqxLIx39ShYsFyTWBRlHb8XCFZXrEWVRvnSjC1opS09uWiS8tOXH0LZ5Z4DFqcK7_Wa1qwXVFbffvl_DIFylh-7mKfqttD03r5kBDMCbvV8T7n7uVnmXFFUSQ9-fJx185c1xI4HFeHGDnvcBg6GXVBT6EiAENX630Ia1t38Red-RKdOJ7sI2SxjyoXg_1YG_rE0PdzddNCni0OjSyuQstuUFBfzzdeZ7dl-5CrrMv9UIz8jBlTEZ6cN8fAKGzfwa7qq"/>
</div>
<!-- Coach Icon Bubble -->
<div class="absolute -bottom-2 -left-2 bg-secondary text-white p-3 rounded-2xl shadow-xl flex items-center gap-2">
<span class="material-symbols-outlined text-white text-[20px]">chat_bubble</span>
<span class="text-[10px] font-bold">VitalAI Coach</span>
</div>
</div>
</div>
<!-- Bottom Half: Content Area -->
<div class="flex flex-col items-center px-8 pt-10 pb-12 bg-white">
<!-- Title -->
<h1 class="text-neutral-title text-[22px] font-bold leading-tight tracking-tight text-center mb-4">
                Seu coach de saude pessoal
            </h1>
<!-- Subtitle -->
<p class="text-neutral-text text-base font-normal leading-relaxed text-center mb-10">
                Relatórios semanais com linguagem de coach, não de planilha.
            </p>
<!-- Page Indicators -->
<div class="flex gap-2 mb-10">
<div class="w-2 h-2 rounded-full bg-slate-200"></div>
<div class="w-2 h-2 rounded-full bg-slate-200"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
</div>
<!-- Primary Action -->
<div class="w-full flex flex-col gap-6">
<button class="w-full h-[48px] bg-primary hover:bg-primary/90 text-white font-bold rounded-xl transition-all shadow-md active:scale-[0.98]">
                    Começar
                </button>
<!-- Secondary Link -->
<button class="text-secondary font-semibold text-[15px] hover:underline">
                    Já tenho conta
                </button>
</div>
</div>
<!-- Home Indicator -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1 bg-slate-200 rounded-full"></div>
</div>
</div>
</body></html>
