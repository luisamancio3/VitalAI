name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
  push:
    branches: [main]
    paths:
      - "ios/**"

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build iPhone app
        run: |
          xcodebuild build \
            -project ios/VitalAI.xcodeproj \
            -scheme VitalAI \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          xcodebuild test \
            -project ios/VitalAI.xcodeproj \
            -scheme VitalAI \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
